<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Quản lý Labo Nha Khoa</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen p-6">
  <header class="mb-6 flex justify-between items-center">
    <h1 class="text-3xl font-bold text-gray-800">Quản lý Đơn hàng Labo Nha Khoa</h1>
    <div id="user-role-display" class="text-gray-600 font-medium"></div>
  </header>

  <section id="login-section" class="max-w-md mx-auto bg-white rounded shadow p-6">
    <h2 class="text-2xl font-semibold mb-4">Đăng nhập</h2>
    <form id="login-form" class="space-y-4">
      <div>
        <label for="username" class="block font-medium mb-1">Tên đăng nhập</label>
        <input type="text" id="username" name="username" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <div>
        <label for="password" class="block font-medium mb-1">Mật khẩu</label>
        <input type="password" id="password" name="password" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
      </div>
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Đăng nhập</button>
    </form>
  </section>

  <main id="app-main" class="hidden grid grid-cols-1 md:grid-cols-2 gap-6">
    <!-- Order List -->
    <section class="bg-white rounded shadow p-4">
      <h2 class="text-xl font-semibold mb-4">Danh sách Đơn hàng</h2>
      <ul id="order-list" class="space-y-2 max-h-[400px] overflow-y-auto">
        <!-- Orders will be dynamically added here -->
      </ul>
    </section>

    <!-- Create Order Form -->
    <section id="order-form-section" class="bg-white rounded shadow p-4">
      <h2 class="text-xl font-semibold mb-4">Tạo Đơn hàng mới</h2>
      <form id="order-form" class="space-y-4">
        <div>
          <label for="customerName" class="block font-medium mb-1">Tên khách hàng</label>
          <input type="text" id="customerName" name="customerName" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label for="orderDetails" class="block font-medium mb-1">Chi tiết đơn hàng</label>
          <textarea id="orderDetails" name="orderDetails" required rows="4" class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
        <div>
          <label for="orderSentDate" class="block font-medium mb-1">Ngày giờ gửi đơn hàng</label>
          <input type="datetime-local" id="orderSentDate" name="orderSentDate" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <div>
          <label for="orderDeliveryDate" class="block font-medium mb-1">Ngày giờ giao đơn hàng</label>
          <input type="datetime-local" id="orderDeliveryDate" name="orderDeliveryDate" required class="w-full border border-gray-300 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        </div>
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">Tạo đơn hàng</button>
      </form>
    </section>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
